[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "shop-report-demo"
version = "0.1.0"
description = "A local packaging exercise"
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
shop-report = "shop_report.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_report"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src/shop_report"]
show_error_codes = true
