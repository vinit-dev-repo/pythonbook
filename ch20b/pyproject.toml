[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "shop-report-demo"
version = "0.1.0"
description = "A local packaging exercise"
requires-python = ">=3.15"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
shop-report = "shop_report.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shop_report"]
